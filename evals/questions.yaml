- id: 22
  difficulty: intermedia
  question: ¿Cuántos clientes compraron más de una vez?
  sql: |
    SELECT count(*) AS recurrentes FROM (
      SELECT c.customer_unique_id FROM orders o JOIN customers c ON c.customer_id = o.customer_id
      GROUP BY 1 HAVING count(DISTINCT o.order_id) > 1
    ) t

- id: 23
  difficulty: difícil
  question: ¿Qué región cayó más en ventas el último trimestre, en porcentaje?
  sql: |
    WITH t AS (
      SELECT CASE
               WHEN c.customer_state IN ('AC','AP','AM','PA','RO','RR','TO') THEN 'Norte'
               WHEN c.customer_state IN ('AL','BA','CE','MA','PB','PE','PI','RN','SE') THEN 'Nordeste'
               WHEN c.customer_state IN ('DF','GO','MT','MS') THEN 'Centro-Oeste'
               WHEN c.customer_state IN ('ES','MG','RJ','SP') THEN 'Sudeste'
               ELSE 'Sul' END AS region,
             sum(CASE WHEN o.order_purchase_timestamp < '2018-04-01' THEN oi.price + oi.freight_value ELSE 0 END) AS q1,
             sum(CASE WHEN o.order_purchase_timestamp >= '2018-04-01' THEN oi.price + oi.freight_value ELSE 0 END) AS q2
      FROM orders o
      JOIN order_items oi ON oi.order_id = o.order_id
      JOIN customers c ON c.customer_id = o.customer_id
      WHERE o.order_status NOT IN ('canceled', 'unavailable')
        AND o.order_purchase_timestamp >= '2018-01-01' AND o.order_purchase_timestamp < '2018-07-01'
      GROUP BY 1
    )
    SELECT region, round(100.0 * (q2 - q1) / q1, 2) AS variacion_pct FROM t ORDER BY 2 LIMIT 1

- id: 24
  difficulty: difícil
  question: ¿Cuánto crecieron las ventas de enero a agosto de 2018 respecto del mismo período de 2017, en porcentaje?
  sql: |
    WITH t AS (
      SELECT sum(CASE WHEN o.order_purchase_timestamp < '2018-01-01' THEN oi.price + oi.freight_value END) AS y2017,
             sum(CASE WHEN o.order_purchase_timestamp >= '2018-01-01' THEN oi.price + oi.freight_value END) AS y2018
      FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
      WHERE o.order_status NOT IN ('canceled', 'unavailable')
        AND ((o.order_purchase_timestamp >= '2017-01-01' AND o.order_purchase_timestamp < '2017-09-01')
          OR (o.order_purchase_timestamp >= '2018-01-01' AND o.order_purchase_timestamp < '2018-09-01'))
    )
    SELECT round(100.0 * (y2018 - y2017) / y2017, 2) AS crecimiento_pct FROM t

- id: 25
  difficulty: difícil
  question: ¿Cuál es el NPS de la empresa según las reseñas?
  sql: |
    SELECT round(100.0 * avg((review_score = 5)::int) - 100.0 * avg((review_score <= 3)::int), 2) AS nps
