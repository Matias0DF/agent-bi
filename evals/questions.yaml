- id: 8
  difficulty: fácil
  question: ¿Cuántas categorías de producto existen?
  sql: SELECT count(DISTINCT product_category_name) AS categorias FROM products

- id: 9
  difficulty: fácil
  question: ¿Cuánto se vendió en total en 2017?
  sql: |
    SELECT round(sum(oi.price + oi.freight_value), 2) AS gmv
    FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
      AND o.order_purchase_timestamp >= '2017-01-01' AND o.order_purchase_timestamp < '2018-01-01'

- id: 10
  difficulty: fácil
  question: ¿Cuántas órdenes se vendieron en 2018?
  sql: |
    SELECT count(*) AS ordenes FROM orders
    WHERE order_status NOT IN ('canceled', 'unavailable')
      AND order_purchase_timestamp >= '2018-01-01' AND order_purchase_timestamp < '2019-01-01'

- id: 11
  difficulty: intermedia
  question: ¿Cuáles fueron las 5 categorías con más ventas en 2017? Nombres en inglés.
  sql: |
    SELECT ct.product_category_name_english AS categoria, round(sum(oi.price + oi.freight_value), 2) AS gmv
    FROM orders o
    JOIN order_items oi ON oi.order_id = o.order_id
    JOIN products p ON p.product_id = oi.product_id
    LEFT JOIN category_translation ct ON ct.product_category_name = p.product_category_name
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
      AND o.order_purchase_timestamp >= '2017-01-01' AND o.order_purchase_timestamp < '2018-01-01'
    GROUP BY 1 ORDER BY 2 DESC LIMIT 5

- id: 12
  difficulty: intermedia
  question: ¿Cuánto vendió cada región de Brasil entre enero y agosto de 2018?
  sql: |
    SELECT CASE
             WHEN c.customer_state IN ('AC','AP','AM','PA','RO','RR','TO') THEN 'Norte'
             WHEN c.customer_state IN ('AL','BA','CE','MA','PB','PE','PI','RN','SE') THEN 'Nordeste'
             WHEN c.customer_state IN ('DF','GO','MT','MS') THEN 'Centro-Oeste'
             WHEN c.customer_state IN ('ES','MG','RJ','SP') THEN 'Sudeste'
             ELSE 'Sul' END AS region,
           round(sum(oi.price + oi.freight_value), 2) AS gmv
    FROM orders o
    JOIN order_items oi ON oi.order_id = o.order_id
    JOIN customers c ON c.customer_id = o.customer_id
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
      AND o.order_purchase_timestamp >= '2018-01-01' AND o.order_purchase_timestamp < '2018-09-01'
    GROUP BY 1 ORDER BY 2 DESC

- id: 13
  difficulty: intermedia
  question: ¿Cuál fue el ticket promedio en 2017?
  sql: |
    SELECT round(sum(oi.price + oi.freight_value) / count(DISTINCT o.order_id), 2) AS ticket
    FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
      AND o.order_purchase_timestamp >= '2017-01-01' AND o.order_purchase_timestamp < '2018-01-01'

- id: 14
  difficulty: intermedia
  question: ¿Cuál fue el mes de 2017 con más ventas y cuánto se vendió?
  sql: |
    SELECT to_char(o.order_purchase_timestamp, 'YYYY-MM') AS mes, round(sum(oi.price + oi.freight_value), 2) AS gmv
    FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
      AND o.order_purchase_timestamp >= '2017-01-01' AND o.order_purchase_timestamp < '2018-01-01'
    GROUP BY 1 ORDER BY 2 DESC LIMIT 1

- id: 15
  difficulty: intermedia
  question: ¿Qué porcentaje de las órdenes entregadas llegó tarde?
  sql: |
    SELECT round(100.0 * avg((order_delivered_customer_date > order_estimated_delivery_date)::int), 2) AS pct_atraso
    FROM orders
    WHERE order_status = 'delivered' AND order_delivered_customer_date IS NOT NULL

- id: 16
  difficulty: intermedia
  question: ¿Cuántos días tarda en promedio una entrega?
  sql: |
    SELECT round(avg(extract(epoch FROM order_delivered_customer_date - order_purchase_timestamp) / 86400)::numeric, 1) AS dias
    FROM orders
    WHERE order_status = 'delivered' AND order_delivered_customer_date IS NOT NULL

- id: 17
  difficulty: intermedia
  question: Entre los estados con al menos 500 órdenes entregadas, ¿cuál tiene la mayor tasa de atraso?
  sql: |
    SELECT c.customer_state,
           round(100.0 * avg((o.order_delivered_customer_date > o.order_estimated_delivery_date)::int), 2) AS pct_atraso
    FROM orders o JOIN customers c ON c.customer_id = o.customer_id
    WHERE o.order_status = 'delivered' AND o.order_delivered_customer_date IS NOT NULL
    GROUP BY 1 HAVING count(*) >= 500 ORDER BY 2 DESC LIMIT 1

- id: 18
  difficulty: intermedia
  question: ¿Cuál es el puntaje promedio de reseñas de las órdenes que llegaron tarde y de las que llegaron a tiempo?
  sql: |
    SELECT o.order_delivered_customer_date > o.order_estimated_delivery_date AS tarde,
           round(avg(r.review_score), 2) AS puntaje
    FROM orders o JOIN order_reviews r ON r.order_id = o.order_id
    WHERE o.order_status = 'delivered' AND o.order_delivered_customer_date IS NOT NULL
    GROUP BY 1 ORDER BY 1

