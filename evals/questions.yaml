- id: 27
  difficulty: difícil
  question: Entre las categorías con al menos 100 reseñas, ¿cuál tiene el peor puntaje promedio? Nombre en inglés.
  sql: |
    SELECT ct.product_category_name_english AS categoria, round(avg(r.review_score), 2) AS puntaje
    FROM order_reviews r
    JOIN (SELECT DISTINCT order_id, product_id FROM order_items) oi ON oi.order_id = r.order_id
    JOIN products p ON p.product_id = oi.product_id
    JOIN category_translation ct ON ct.product_category_name = p.product_category_name
    GROUP BY 1 HAVING count(*) >= 100 ORDER BY 2 LIMIT 1

- id: 28
  difficulty: difícil
  question: ¿Cuántos ítems tiene en promedio una orden vendida?
  sql: |
    SELECT round(count(*)::numeric / count(DISTINCT o.order_id), 2) AS items
    FROM orders o JOIN order_items oi ON oi.order_id = o.order_id
    WHERE o.order_status NOT IN ('canceled', 'unavailable')

- id: 29
  difficulty: difícil
  question: ¿Qué porcentaje de las ventas de 2017 vino de la región Sudeste?
  sql: |
    SELECT round(100.0 * sum(CASE WHEN c.customer_state IN ('ES','MG','RJ','SP') THEN oi.price + oi.freight_value ELSE 0 END)
                 / sum(oi.price + oi.freight_value), 2) AS pct_sudeste
    FROM orders o
    JOIN order_items oi ON oi.order_id = o.order_id
    JOIN customers c ON c.customer_id = o.customer_id
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
      AND o.order_purchase_timestamp >= '2017-01-01' AND o.order_purchase_timestamp < '2018-01-01'

- id: 30
  difficulty: difícil
  question: ¿Cuánto pagó en total el cliente que más gastó, sumando todas sus compras?
  sql: |
    SELECT round(sum(p.payment_value), 2) AS total
    FROM orders o
    JOIN customers c ON c.customer_id = o.customer_id
    JOIN order_payments p ON p.order_id = o.order_id
    GROUP BY c.customer_unique_id ORDER BY 1 DESC LIMIT 1
