services:
  db:
    image: pgvector/pgvector:pg16
    container_name: agent-bi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bi
      POSTGRES_PASSWORD: bi
      POSTGRES_DB: olist
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
