services:
  db:
    image: pgvector/pgvector:pg16
    container_name: agent-bi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bi
      POSTGRES_PASSWORD: bi
      POSTGRES_DB: olist
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: agent-bi-app
    env_file: .env
    environment:
      DATABASE_URL: postgresql://bi:bi@db:5432/olist
    ports:
      - "8080:7860"
    depends_on:
      - db

  tunnel:
    image: cloudflare/cloudflared:2025.4.0
    container_name: agent-bi-tunnel
    command: tunnel --no-autoupdate --url http://app:7860
    depends_on:
      - app
    profiles:
      - public

volumes:
  pgdata:
