[project]
name = "agent-bi"
version = "0.1.0"
description = "Agente que responde preguntas de negocio sobre datos usando SQL y RAG"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.14.0",
    "fastapi>=0.143.2",
    "fastembed>=0.9.0",
    "langgraph>=1.2.15",
    "mcp[cli]>=2.3.0",
    "pandas>=3.0.6",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_bi"]
