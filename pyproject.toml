[project]
name = "agent-bi"
version = "0.1.0"
description = "Agente que responde preguntas de negocio sobre datos usando SQL y RAG"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.14.0",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_bi"]
